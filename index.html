<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Spam Detector</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fa; text-align: center; padding-top: 50px; }
        .wrapper { background: #ffffff; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 45%; text-align: left; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: none; font-size: 15px; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .output-box { margin-top: 25px; padding: 15px; border-radius: 4px; font-weight: bold; font-size: 18px; text-align: center; }
        .spam { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .ham { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2 style="text-align: center; color: #333;">📬 SMS & Email Spam Detector</h2>
        
        <form method="POST">
            <label for="message">Enter message text:</label>
            <textarea id="message" name="message" placeholder="Paste message text here..." required>{{ text_entered }}</textarea>
            <button type="submit">Classify Message</button>
        </form>

        {% if prediction %}
            <div class="output-box {% if 'SPAM' in prediction %}spam{% else %}ham{% endif %}">
                Result: {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
